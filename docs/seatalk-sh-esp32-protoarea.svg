<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="Helvetica,Arial,sans-serif">
  <style>
    .wire{stroke:#111;stroke-width:2;fill:none}
    .node{fill:#111}
    .lbl{font-size:14px;fill:#111}
    .sub{font-size:12px;fill:#444}
    .pin{font-size:13px;fill:#005a9c;font-weight:bold}
    .box{fill:#f4f4f4;stroke:#111;stroke-width:2}
    .title{font-size:18px;fill:#111;font-weight:bold}
    .rail12{fill:#b00}
    .railg{fill:#060}
  </style>

  <text class="title" x="20" y="28">SeaTalk &#8596; SH-ESP32 proto-area subcircuit (opto version, superseded)</text>
  <text class="sub" x="20" y="48">Rev 2.1.0 opto block: ISO_IN=GPIO35 (RX), ISO_OUT=GPIO33 (TX), V_ISO=Vext. SeaTalk = one bidirectional 12V open-collector line, 4800-8S1.</text>

  <!-- ===================== RAILS ===================== -->
  <!-- +12V rail at y=90 -->
  <line class="wire" x1="60" y1="90" x2="900" y2="90"/>
  <text class="lbl rail12" x="60" y="82">+12 V  (on-board bus 12 V; no Protected-Voltage pad on this rev  &#8592;  J1.1)</text>

  <!-- GND rail at y=560 -->
  <line class="wire" x1="60" y1="560" x2="900" y2="560"/>
  <text class="lbl railg" x="60" y="580">GND  (board GND = ISO_GND pad = SeaTalk signal ground  &#8592;  J1.3)</text>

  <!-- ===================== DATA NODE ===================== -->
  <!-- DATA vertical spine at x=150, from rail region down to the lowest branch -->
  <text class="pin" x="30" y="265">J1.2 DATA</text>
  <line class="wire" x1="90" y1="260" x2="150" y2="260"/>
  <!-- DATA spine: from R_pull bottom (y=200) down to D_out branch (y=360) -->
  <line class="wire" x1="150" y1="200" x2="150" y2="360"/>
  <circle class="node" cx="150" cy="260" r="4"/>

  <!-- R_pull: +12V(y=90) down to DATA spine(y=200), on x=150 -->
  <line class="wire" x1="150" y1="90" x2="150" y2="120"/>
  <rect class="box" x="135" y="120" width="30" height="60"/>
  <line class="wire" x1="150" y1="180" x2="150" y2="200"/>
  <circle class="node" cx="150" cy="90" r="4"/>
  <text class="lbl" x="172" y="150">R_pull</text>
  <text class="sub" x="172" y="166">10 k&#8486;</text>

  <!-- ===================== RX LEG (upper lane, y=260) : DATA -> R_in -> ISO_IN ===================== -->
  <text class="sub" x="200" y="252" font-size="12">RX leg</text>
  <line class="wire" x1="150" y1="260" x2="300" y2="260"/>
  <rect class="box" x="300" y="245" width="60" height="30"/>
  <text class="lbl" x="312" y="238">R_in</text>
  <text class="sub" x="366" y="258">5.6 k&#8486; (was 2.2 k)</text>
  <line class="wire" x1="360" y1="260" x2="640" y2="260"/>
  <circle class="node" cx="640" cy="260" r="4"/>

  <!-- ===================== TX LEG (lower lane, y=360) : DATA -> D_out -> ISO_OUT ===================== -->
  <text class="sub" x="200" y="352" font-size="12">TX leg</text>
  <!-- direct wire: ISO_OUT is already an open-collector NPN (Q901) with a 3.9k pull-up (R904) -->
  <line class="wire" x1="150" y1="360" x2="640" y2="360"/>
  <circle class="node" cx="150" cy="360" r="4"/>
  <circle class="node" cx="640" cy="360" r="4"/>
  <text class="lbl" x="372" y="352">direct wire, no diode</text>
  <text class="sub" x="372" y="380" font-size="11">(old D_out was backwards: it blocked TX)</text>

  <!-- ===================== V_ISO LEG (top lane, y=150) : +12V -> V_ISO ===================== -->
  <line class="wire" x1="500" y1="90" x2="500" y2="150"/>
  <circle class="node" cx="500" cy="90" r="4"/>
  <line class="wire" x1="500" y1="150" x2="640" y2="150"/>
  <circle class="node" cx="640" cy="150" r="4"/>
  <text class="sub" x="505" y="130" font-size="12">V_ISO (Vext) &#8592; +12 V</text>

  <!-- ===================== GND LEG (bottom lane, y=460) : ISO_GND -> GND rail ===================== -->
  <line class="wire" x1="640" y1="460" x2="500" y2="460"/>
  <line class="wire" x1="500" y1="460" x2="500" y2="560"/>
  <circle class="node" cx="500" cy="560" r="4"/>
  <circle class="node" cx="640" cy="460" r="4"/>
  <text class="sub" x="505" y="500" font-size="12">ISO_GND &#8594; board / SeaTalk GND</text>

  <!-- ===================== OPTO BLOCK (right side, pins on LEFT edge at the 4 lanes) ===================== -->
  <rect class="box" x="640" y="120" width="230" height="370"/>
  <text class="title" x="665" y="155" font-size="15">SH-ESP32 OPTO BLOCK</text>
  <text class="sub" x="665" y="173" font-size="11">(Rev 2.1.0)</text>

  <!-- pad labels at each lane -->
  <text class="pin" x="650" y="146">V_ISO</text>
  <text class="pin" x="650" y="256">ISO_IN</text>
  <text class="sub" x="650" y="272" font-size="11">= OPTO_IN / GPIO35 (RX)</text>
  <text class="pin" x="650" y="356">ISO_OUT</text>
  <text class="sub" x="650" y="372" font-size="11">= OPTO_OUT / GPIO33 (TX)</text>
  <text class="sub" x="650" y="388" font-size="11">Q901 collector, 3.9k to V_ISO</text>
  <text class="pin" x="650" y="456">ISO_GND</text>

  <!-- ===================== FOOTER ===================== -->
  <text class="sub" x="20" y="604">RX: DATA low -&gt; ISO_IN LED off -&gt; GPIO35 low.  TX: GPIO33 LOW -&gt; Q901 on -&gt; DATA pulled low; HIGH -&gt; released.</text>
  <text class="sub" x="20" y="619">Both stages non-inverting: SoftwareSerial invert=false.  RX leg draws ~1.4 mA, so DATA idles near 9 V.</text>
  <text class="sub" x="20" y="634">Corrected from the Hat Labs Rev 2.0.0 schematic. Current build: seatalk-sh-esp32-npn.svg.</text>
</svg>
